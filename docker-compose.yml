version: "3.8"
services:
  db:
    # Postgres 18+ mudou layout de volume; `postgres` (latest) falha com dados antigos em ./postgres
    image: postgres:16
    container_name: postgres-help-us
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    volumes:
      - ./postgres:/var/lib/postgresql/data